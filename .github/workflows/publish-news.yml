name: Publish TruX Technology News
on:
  issues:
    types: [opened, edited, closed, reopened, deleted]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request == null && startsWith(github.event.issue.title, 'NEWS:'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/sync-news.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - run: |
          git config user.name "trux-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news data sitemap.xml rss.xml
          git diff --cached --quiet || git commit -m "publish TruX Technology news"
          git push
