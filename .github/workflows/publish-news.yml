name: Publish TruX Technology News

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

# One run at a time so two quick edits never fight over the push
concurrency:
  group: publish-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Owner only: the issue must be written by the repo owner AND the person triggering it must be the owner
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request == null &&
        github.event.issue.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        (
          startsWith(github.event.issue.title, 'NEWS:') ||
          startsWith(github.event.changes.title.from, 'NEWS:')
        )
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build news pages
        run: node scripts/sync-news.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      - name: Commit and push
        run: |
          git config user.name "trux-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A news data sitemap.xml rss.xml
          if ! git diff --cached --quiet; then
            git commit -m "publish TruX Technology news"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
